<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171a">
<title>Arma 3 Artillery</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<style>
  :root {
    --bg: #14171a;
    --panel: #1d2125;
    --line: #2c3238;
    --text: #e6e8ea;
    --muted: #8b949c;
    --accent: #c8a24a;
    --accent-ink: #14171a;
    --warn: #e0894a;
    --bad: #e05a4a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f1ec; --panel: #ffffff; --line: #d9d7cf; --text: #1d2125;
      --muted: #666d73; --accent: #8a6a1c; --accent-ink: #ffffff; --warn: #b05a1c; --bad: #b8352a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px 32px;
    max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 18px; margin: 0 0 14px; letter-spacing: .02em; }
  h1 span { color: var(--muted); font-weight: 400; }

  .weapons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
  .weapons button {
    font: inherit; padding: 10px 6px; border-radius: 8px; cursor: pointer;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); text-align: center;
  }
  .weapons button small { display: block; color: var(--muted); font-size: 12px; }
  .weapons button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .weapons button[aria-pressed="true"] small { color: inherit; opacity: .8; }

  fieldset { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; margin: 0 0 10px; padding: 10px 12px 12px; }
  legend { padding: 0 6px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  label { display: block; font-size: 12px; color: var(--muted); }
  input {
    width: 100%; margin-top: 3px; padding: 10px 8px; font: 18px var(--mono);
    background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .legend-row { display: flex; justify-content: space-between; align-items: center; }
  .link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 0 2px; }

  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 10px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font: 600 22px var(--mono); }
  .stat span { font-size: 12px; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; }
  td { font-family: var(--mono); }
  td.elev { font-size: 20px; font-weight: 600; color: var(--accent); }
  td small { color: var(--muted); font-size: 12px; display: block; }
  .msg { padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
  .msg.bad { color: var(--bad); border-color: var(--bad); }
  .warn { color: var(--warn); }
  footer { margin-top: 18px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<h1>Arma 3 Artillery <span>· RHS</span></h1>

<div class="weapons" id="weapons" role="group" aria-label="Орудие"></div>

<fieldset>
  <div class="legend-row"><legend>Орудие</legend></div>
  <div class="row">
    <label>X, м<input id="gx" inputmode="decimal" autocomplete="off"></label>
    <label>Y, м<input id="gy" inputmode="decimal" autocomplete="off"></label>
    <label>Высота, м<input id="gz" inputmode="decimal" autocomplete="off"></label>
  </div>
</fieldset>

<fieldset>
  <div class="legend-row"><legend>Цель</legend><button class="link" id="clearTarget" type="button">очистить</button></div>
  <div class="row">
    <label>X, м<input id="tx" inputmode="decimal" autocomplete="off"></label>
    <label>Y, м<input id="ty" inputmode="decimal" autocomplete="off"></label>
    <label>Высота, м<input id="tz" inputmode="decimal" autocomplete="off"></label>
  </div>
</fieldset>

<div id="result"><div class="msg">Введите координаты орудия и цели.</div></div>

<footer>Углы в тысячных (6400). Координаты — метры карты: X на восток, Y на север. Калькулятор для игры Arma 3, таблицы мода RHS.</footer>

<script>
const $ = (id) => document.getElementById(id);
const fields = ["gx", "gy", "gz", "tx", "ty", "tz"];
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let weapons = [];
let weaponId = store.get("weapon") || "2b11";

const num = (s) => {
  const v = String(s).trim().replace(",", ".");
  return v === "" ? null : Number(v);
};
const fmt = (v, d = 0) => v.toLocaleString("ru-RU", { minimumFractionDigits: d, maximumFractionDigits: d });

function renderWeapons() {
  $("weapons").innerHTML = "";
  for (const w of weapons) {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", String(w.id === weaponId));
    b.innerHTML = `${w.name.split(",")[0]}<small>${fmt(w.min_range_m)}–${fmt(w.max_range_m)} м</small>`;
    b.title = w.name;
    b.onclick = () => { weaponId = w.id; store.set("weapon", w.id); renderWeapons(); calc(); };
    $("weapons").append(b);
  }
}

function show(html) { $("result").innerHTML = html; }

let seq = 0;
async function calc() {
  for (const f of fields) store.set(f, $(f).value);
  const v = Object.fromEntries(fields.map((f) => [f, num($(f).value)]));
  if ([v.gx, v.gy, v.tx, v.ty].some((x) => x === null)) {
    show('<div class="msg">Введите координаты орудия и цели.</div>');
    return;
  }
  if (Object.values(v).some((x) => x !== null && !Number.isFinite(x))) {
    show('<div class="msg bad">Координаты должны быть числами.</div>');
    return;
  }
  const body = {
    weapon: weaponId,
    gun: { x: v.gx, y: v.gy, z: v.gz ?? 0 },
    target: { x: v.tx, y: v.ty, z: v.tz ?? 0 },
  };
  const my = ++seq;
  let data;
  try {
    const r = await fetch("/api/solve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    data = await r.json();
    if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Проверьте введённые значения");
  } catch (e) {
    if (my === seq) show(`<div class="msg bad">${e.message || "Сервер недоступен"}</div>`);
    return;
  }
  if (my !== seq) return;
  renderResult(data);
}

function renderResult(d) {
  const dh = d.height_diff_m;
  let html = `<div class="summary">
    <div class="stat"><b>${fmt(d.range_m)}</b><span>Дальность, м</span></div>
    <div class="stat"><b>${fmt(d.azimuth_mil)}</b><span>Азимут, mil</span></div>
    <div class="stat"><b>${dh > 0 ? "+" : ""}${fmt(dh)}</b><span>Превышение цели, м</span></div>
  </div>`;
  if (!d.in_range) {
    html += `<div class="msg bad">Цель вне досягаемости: ${fmt(d.min_range_m)}–${fmt(d.max_range_m)} м.</div>`;
  } else {
    const hasTof = d.charges.some((c) => c.time_of_flight_s !== null);
    html += `<table><thead><tr><th>Заряд</th><th>Возвышение, mil</th>${hasTof ? "<th>Полёт, с</th>" : ""}</tr></thead><tbody>`;
    for (const c of d.charges) {
      const note = c.height_correction_known
        ? (c.height_correction_mil ? `<small>табл. ${fmt(c.table_elevation_mil, 1)} ${c.height_correction_mil > 0 ? "−" : "+"} ${fmt(Math.abs(c.height_correction_mil), 1)}</small>` : "")
        : `<small class="warn">нет поправки на высоту</small>`;
      html += `<tr><td>${c.charge}</td><td class="elev">${fmt(c.elevation_mil)}${note}</td>${hasTof ? `<td>${c.time_of_flight_s !== null ? fmt(c.time_of_flight_s, 1) : "—"}</td>` : ""}</tr>`;
    }
    html += "</tbody></table>";
  }
  show(html);
}

let timer;
for (const f of fields) {
  $(f).value = store.get(f) ?? "";
  $(f).addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(calc, 200); });
}
$("clearTarget").onclick = () => { for (const f of ["tx", "ty", "tz"]) $(f).value = ""; calc(); $("tx").focus(); };

fetch("/api/weapons").then((r) => r.json()).then((list) => {
  weapons = list;
  if (!weapons.some((w) => w.id === weaponId)) weaponId = weapons[0].id;
  renderWeapons();
  calc();
}).catch(() => show('<div class="msg bad">Сервер недоступен</div>'));
</script>
</body>
</html>
